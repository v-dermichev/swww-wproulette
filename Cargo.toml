[package]
name = "wproulette"
version = "0.1.0"
edition = "2024"
description = "Wallpaper roulette — browse, star, trash, and rotate wallpapers with awww"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.9"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
